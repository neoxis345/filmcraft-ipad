# FilmCraft for iPadOS: the Xcode project (generated with XcodeGen: `xcodegen generate` here, or
# `./deploy.sh`, which does everything). The Rust engine is built by build-rust.sh before the Swift
# sources and linked as a static library.
name: FilmCraft
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
configFiles:
  Debug: Generated/Signing.xcconfig
  Release: Generated/Signing.xcconfig
settings:
  base:
    MARKETING_VERSION: "0.13.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  FilmCraft:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: FilmCraft
        excludes:
          - "**/*.attribution"
    configFiles:
      Debug: Generated/Rust.xcconfig
      Release: Generated/Rust.xcconfig
    settings:
      base:
        INFOPLIST_FILE: FilmCraft/Info.plist
        PRODUCT_NAME: FilmCraft
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: FilmCraft/FilmCraft-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_BITCODE: NO
        DEAD_CODE_STRIPPING: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: YES
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        DEBUG_INFORMATION_FORMAT: dwarf
    preBuildScripts:
      - name: Build the Rust engine
        script: "\"${SRCROOT}/build-rust.sh\""
        basedOnDependencyAnalysis: false
        outputFiles:
          - "$(FILMCRAFT_RUST_LIB)"
  FilmCraftUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: FilmCraftUITests
    dependencies:
      - target: FilmCraft
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(PRODUCT_BUNDLE_IDENTIFIER).uitests"
        PRODUCT_NAME: FilmCraftUITests
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: NO
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: ""
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FilmCraft
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: YES
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
schemes:
  FilmCraft:
    build:
      targets:
        FilmCraft: all
    run:
      config: Debug
    archive:
      config: Release
  FilmCraftUITests:
    build:
      targets:
        FilmCraft: all
        FilmCraftUITests: test
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: FilmCraftUITests
